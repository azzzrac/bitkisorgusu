<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kayıt Ol - Bitki Keşif Portalı</title>
    <link rel="stylesheet" href="styles.css?v=10">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #081c15 100%);
            margin: 0;
            padding: 16px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(82, 183, 136, 0.3) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            left: -50px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(116, 198, 157, 0.2) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
        }

        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-logo {
            font-size: 48px;
            margin-bottom: 8px;
            display: inline-block;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .auth-card-header h2 {
            font-size: 26px;
            font-weight: 800;
            color: #1b4332;
            margin: 0 0 6px 0;
        }

        .auth-card-header p {
            color: #52796f;
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #2d6a4f;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid #e0e6ed;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background: #f8faf9;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #40916c;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(64, 145, 108, 0.15);
        }

        .btn-primary-auth {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 16px rgba(45, 106, 79, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-primary-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(45, 106, 79, 0.4);
            background: linear-gradient(135deg, #40916c 0%, #2d6a4f 100%);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #52796f;
        }

        .auth-footer a {
            color: #1b4332;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 16px;
            font-size: 13px;
            color: #74c69d;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            width: 100%;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .alert-message {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background-color: #ffeef0;
            color: #d32f2f;
            border: 1px solid #ffcdd2;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
    </style>
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>

    <div class="auth-card">
        <div class="auth-card-header">
            <div class="auth-logo">📝</div>
            <h2>Yeni Hesap Oluştur</h2>
            <p>Bitki Keşif Portalı ailesine katılın</p>
        </div>

        <div id="alertBox" class="alert-message"></div>

        <form id="registerForm" onsubmit="return false;">
            <div class="form-group">
                <label for="nameInput">Ad Soyad</label>
                <div class="input-wrapper">
                    <span>👤</span>
                    <input type="text" id="nameInput" placeholder="Örn: Ahmet Yılmaz" required>
                </div>
            </div>

            <div class="form-group">
                <label for="emailInput">E-posta Adresi</label>
                <div class="input-wrapper">
                    <span>📧</span>
                    <input type="email" id="emailInput" placeholder="ornek@gmail.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="passwordInput">Şifre (En az 6 karakter)</label>
                <div class="input-wrapper">
                    <span>🔒</span>
                    <input type="password" id="passwordInput" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-primary-auth" id="btnRegister">
                ✨ Hesabı Oluştur
            </button>
        </form>

        <div class="auth-footer">
            Zaten hesabınız var mı? <a href="login.html">Giriş Yap 🔑</a>
        </div>
        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const alertBox = document.getElementById('alertBox');

        function showAlert(msg, isError = true) {
            alertBox.textContent = msg;
            alertBox.className = `alert-message ${isError ? 'alert-error' : 'alert-success'}`;
            alertBox.style.display = 'block';
        }

        // Firebase Auth Dinleyicisi
        if (typeof firebase !== 'undefined') {
            firebase.auth().onAuthStateChanged((user) => {
                if (user && user.displayName) {
                    const userData = {
                        name: user.displayName || (user.email ? user.email.split('@')[0] : "Botanik Sevdalısı"),
                        email: user.email || "",
                        avatar: user.photoURL || "🌿"
                    };
                    localStorage.setItem('bitki_user', JSON.stringify(userData));
                    window.location.href = 'index.html';
                }
            });
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!name || !email || !password) {
                showAlert('Lütfen tüm alanları doldurun.');
                return;
            }

            if (password.length < 6) {
                showAlert('Şifre en az 6 karakter olmalıdır.');
                return;
            }

            try {
                if (typeof firebase !== 'undefined' && firebase.auth) {
                    const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    
                    // Ad Soyad Profil Güncellemesi
                    await user.updateProfile({
                        displayName: name
                    });

                    showAlert('Kayıt başarılı! Portala yönlendiriliyorsunuz...', false);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showAlert('Firebase henüz yapılandırılmadı.');
                }
            } catch (err) {
                console.error("Kayıt Hatası:", err);
                let message = 'Kayıt yapılırken bir hata oluştu.';
                if (err.code === 'auth/email-already-in-use') message = 'Bu e-posta adresi zaten kullanımda.';
                if (err.code === 'auth/invalid-email') message = 'Geçersiz e-posta adresi.';
                if (err.code === 'auth/weak-password') message = 'Şifre çok zayıf.';
                showAlert(message);
            }
        });
    </script>
</body>
</html>
